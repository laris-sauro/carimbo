<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5A3A2A">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/style.css">
  <title>Carimbo | Nova memória</title>
</head>
<body>
  <header class="topo">
    <h1 class="recorte" data-texto="Nova memória"></h1>
    <p class="sub">cole mais um pedacinho da viagem</p>
  </header>

  <main>
    <section class="papel fita">
      <form id="form-memoria">
        <div>
          <label for="titulo">Título</label>
          <input type="text" id="titulo" placeholder="Ex.: Pôr do sol no Pantanal" required>
        </div>

        <div>
          <label for="data">Data</label>
          <input type="date" id="data" required>
        </div>

        <div>
          <label for="nota">Anotação</label>
          <textarea id="nota" placeholder="Como foi esse momento?"></textarea>
        </div>

        <div>
          <label for="foto">Foto</label>
          <input type="file" id="foto" accept="image/*" capture="environment">
          <img id="previa" alt="Prévia da foto" hidden style="width:100%;margin-top:10px;border-radius:12px;">
        </div>

        <div>
          <label>Localização</label>
          <button type="button" id="btn-gps" class="btn sec">📍 Usar minha localização</button>
          <p id="status-gps" class="carimbo">Localização não registrada.</p>
        </div>

        <button type="submit" class="btn">Salvar memória</button>
      </form>
    </section>
  </main>

  <nav class="nav">
    <a href="index.html"><span class="ico">🏠</span>Início</a>
    <a href="nova.html" class="ativo"><span class="ico">📸</span>Nova</a>
    <a href="album.html"><span class="ico">📒</span>Álbum</a>
    <a href="config.html"><span class="ico">⚙️</span>Ajustes</a>
  </nav>

  <script src="./js/db.js"></script>
<script src="./js/memorias.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
